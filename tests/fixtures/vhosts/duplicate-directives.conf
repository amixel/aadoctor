server
{
    listen 80;
    server_name doubled.com;
    root /www/wwwroot/doubled.com;

    access_log /www/wwwlogs/doubled.com.log;
    access_log /www/wwwlogs/doubled.com.second.log;
    error_log /www/wwwlogs/doubled.com.error.log;

    location /api
    {
        access_log /www/wwwlogs/doubled.com.api.log;
    }
}
