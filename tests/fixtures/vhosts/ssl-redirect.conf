server
{
    listen 80;
    server_name secure.com www.secure.com;
    return 301 https://$server_name$request_uri;
}

server
{
    listen 443 ssl http2;
    server_name secure.com www.secure.com;
    root /www/wwwroot/secure.com;

    ssl_certificate /www/server/panel/vhost/cert/secure.com/fullchain.pem;

    location ~ \.php$
    {
        include fastcgi.conf;
    }

    access_log /www/wwwlogs/secure.com.log;
    error_log /www/wwwlogs/secure.com.error.log;
}
